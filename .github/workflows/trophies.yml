name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Clone Trophy Generator
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git trophy-generator

      - name: Generate Trophy SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd trophy-generator
          deno run --allow-read --allow-write --allow-net --allow-env render_svg.ts \
            --username Yash-Singh607 \
            --output_path ../github-trophies.svg \
            --token "$GH_TOKEN" \
            --theme tokyo-night

      - name: Prepare output
        run: |
          mkdir -p dist
          cp github-trophies.svg dist/github-trophies.svg

      - name: Publish Trophy
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
